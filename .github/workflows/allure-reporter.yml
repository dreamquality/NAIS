name: Cypress tests with Allure report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # daily regression, 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least privilege by default; only the publishing job gets write access.
permissions:
  contents: read

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cypress:
    name: Cypress (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          runTests: false

      - name: Cypress run (cypress-split shard)
        # Known server defects keep a few tests red by design (see README);
        # the report must still be generated and published. Visual snapshots
        # are browser-specific and run only locally (-@visual).
        run: npx cypress run --browser chrome --expose grepTags=-@visual
        continue-on-error: true
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: reports/screenshots
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Allure report → GitHub Pages
    needs: cypress
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the report to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Allure CLI (project devDependency, no Cypress binary)
        run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Download Allure results from every shard
        uses: actions/download-artifact@v7
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Restore run history from gh-pages
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        # historyPath comes from allurerc.mjs; the previous history.jsonl is
        # published next to the report so the next run can pick it up.
        run: |
          mkdir -p allure-history
          cp gh-pages/history/history.jsonl allure-history/history.jsonl 2>/dev/null || echo "no previous history"
          npx allure generate allure-results --clean --history-limit 20 \
            --history-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          mkdir -p allure-report/history
          cp allure-history/history.jsonl allure-report/history/history.jsonl
          touch allure-report/.nojekyll

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Deploy report to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
