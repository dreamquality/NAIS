name: Cypress tests with Allure report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # daily regression, 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cypress:
    name: Cypress (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          runTests: false

      - name: Cypress run (cypress-split shard)
        # Known server defects keep a few tests red by design (see README);
        # the report must still be generated and published. Visual snapshots
        # are browser-specific and run only locally (-@visual).
        run: npx cypress run --browser chrome --expose grepTags=-@visual
        continue-on-error: true
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: reports/screenshots
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Allure report → GitHub Pages
    needs: cypress
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Allure results from every shard
        uses: actions/download-artifact@v6
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get Allure history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-history
          retention-days: 14

      - name: Deploy report to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
