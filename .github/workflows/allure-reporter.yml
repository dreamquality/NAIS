name: Cypress tests with Allure report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # daily regression, 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least privilege by default; only the publishing job gets write access.
permissions:
  contents: read

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cypress:
    name: Cypress (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cypress install
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          browser: chrome
          runTests: false

      - name: Cypress run (cypress-split shard)
        # Known server defects keep a few tests red by design (see README);
        # the report must still be generated and published. Visual snapshots
        # are browser-specific and run only locally (-@visual).
        run: npx cypress run --browser chrome --expose grepTags=-@visual
        continue-on-error: true
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Upload Allure results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: reports/screenshots
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Allure report → GitHub Pages
    needs: cypress
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the report to the gh-pages branch
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Allure results from every shard
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get Allure history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-history
          retention-days: 14

      - name: Deploy report to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
