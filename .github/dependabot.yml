version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:30'
      timezone: 'Europe/Kyiv'
    groups:
      cypress:
        patterns: ['cypress*', 'allure*']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Europe/Kyiv'
